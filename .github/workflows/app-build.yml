name: App build

# Run by hand from the Actions tab: choose the platform and whether to send the build to the stores.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Which app to build"
        type: choice
        options: [all, ios, android]
        default: all
      submit:
        description: "Send the build to TestFlight / Play internal testing"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Link the Expo project (first run creates it)
        run: eas init --non-interactive --force
      - name: Build
        run: >
          eas build --platform ${{ inputs.platform }} --profile production --non-interactive --no-wait
          ${{ inputs.submit && '--auto-submit' || '' }}
